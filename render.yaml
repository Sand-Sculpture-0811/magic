services:
  - type: web
    name: astra-magic
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: HOST
        value: 0.0.0.0
      - key: GLM_MODEL
        value: glm-5.3-flash
      - key: GLM_API_KEY
        sync: false
      - key: AI_ACCESS_CODE
        sync: false
